[package]
name = "gst-textrollup"
version = "0.1.0"
authors = ["Elliott Darfink <elliott.darfink@gmail.com>"]
edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"
description = "GStreamer element that turns word-level text into roll-up captions"
repository = "https://github.com/darfink/gst-textrollup"

[dependencies]
gst = { package = "gstreamer", version = "0.25", features = ["v1_20"] }
unicode-width = "0.2"

[dev-dependencies]
gst-check = { package = "gstreamer-check", version = "0.25" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "gsttextrollup"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
static = []
capi = []
doc = ["gst/v1_18"]

[package.metadata.capi]
min_version = "0.9.21"

[package.metadata.capi.header]
enabled = false

[package.metadata.capi.library]
install_subdir = "gstreamer-1.0"
versioning = false
import_library = false

[package.metadata.capi.pkg_config]
requires_private = "gstreamer-1.0, gobject-2.0, glib-2.0, gmodule-2.0"
